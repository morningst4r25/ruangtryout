name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    name: Versi aset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cek ?v= aset dan CACHE_NAME sw.js sinkron
        run: node tools/bump-assets.mjs --check

  rules:
    name: Firestore Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instal dependensi cek rules
        working-directory: tools
        run: npm ci

      - name: Kompilasi rules dan jalankan unit test akses
        run: npx --yes firebase-tools@13.35.1 emulators:exec --only firestore --project demo-ruangtryout "node tools/check-rules.mjs && node --test tools/rules.test.mjs"

  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Instal dependensi
        run: npm ci

      - name: Unit test
        run: npm test
