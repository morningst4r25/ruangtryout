<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi CAT - Ruang Tryout</title>
    <meta name="theme-color" content="#0f172a">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-blue-500 selection:text-white">

    <!-- Header Ujian -->
    <header class="bg-slate-900/95 border-b border-slate-800 px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center shrink-0 backdrop-blur-xl">
        <a href="index.html" class="flex items-center gap-2.5 min-w-0 group" aria-label="Kembali ke Ruang Tryout">
            <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center font-black text-white text-base shadow-lg shadow-blue-600/20 group-hover:bg-blue-500 transition-colors">
                R
            </div>

            <div class="min-w-0 leading-tight">
                <div class="text-sm sm:text-base font-black text-white tracking-tight">
                    Ruang<span class="text-blue-400">Tryout</span>
                </div>
                <div class="hidden sm:block text-[9px] uppercase tracking-[0.18em] font-bold text-slate-500 mt-0.5">
                    Mode Simulasi CAT
                </div>
            </div>
        </a>

        <div class="flex items-center gap-2">
            <span class="hidden md:inline-flex items-center gap-1.5 text-[10px] font-semibold text-slate-500 mr-1">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                Ujian sedang berlangsung
            </span>

            <button
                type="button"
                onclick="requestExitExam()"
                class="inline-flex items-center gap-2 text-[11px] sm:text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 sm:px-4 py-2.5 rounded-xl border border-slate-700 hover:border-slate-600 transition-all"
            >
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M10 17l5-5-5-5" />
                    <path d="M15 12H3" />
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                </svg>
                <span class="hidden sm:inline">Keluar Ujian</span>
                <span class="sm:hidden">Keluar</span>
            </button>
        </div>
    </header>

    <!-- Main Full Width Exam Wrapper -->
    <main class="flex-1 w-full px-2 sm:px-4 lg:px-6 py-3 sm:py-4 flex flex-col min-h-0">
        <div
            id="quiz-card"
            class="w-full flex-1 min-h-0 bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden flex flex-col shadow-2xl shadow-black/10"
        >
            <div class="flex-1 flex items-center justify-center px-6 py-20">
                <div class="text-center space-y-3">
                    <div class="w-11 h-11 mx-auto rounded-xl border border-blue-500/20 bg-blue-500/10 flex items-center justify-center">
                        <span class="w-5 h-5 rounded-full border-2 border-blue-400 border-t-transparent animate-spin"></span>
                    </div>
                    <p class="text-sm text-slate-400 font-medium">Menyiapkan lembar ujian...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Minimal -->
    <footer class="shrink-0 border-t border-slate-900 bg-slate-950 py-2 text-center text-[10px] text-slate-600">
        &copy; 2026 Ruang Tryout &bull; Platform Simulasi Ujian Independen
    </footer>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <!-- Bank Soal + Logika Ujian -->
    <script src="questions.js"></script>
    <script src="app.js"></script>
</body>
</html>
