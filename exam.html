<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Simulasi CAT - Ruang Tryout</title>

    <meta
        name="theme-color"
        content="#0f172a"
    >


    <!-- =====================================================
         TAILWIND CSS
    ====================================================== -->

    <script src="https://cdn.tailwindcss.com"></script>


    <!-- CSS GLOBAL PROJECT -->

    <link
        rel="stylesheet"
        href="style.css"
    >


    <!-- =====================================================
         CRITICAL EXAM CSS
    ====================================================== -->

    <style>

        /*
        =====================================================
        GLOBAL SINGLE SCREEN
        =====================================================
        */

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
        }


        body {
            height: 100vh;
            height: 100dvh;
            min-height: 100vh;
            min-height: 100dvh;
        }



        /*
        =====================================================
        FLEX CHILD FIX
        =====================================================
        */

        #exam-main,
        #quiz-card,
        #question-panel,
        #question-content,
        #question-sidebar {
            min-height: 0;
        }



        /*
        =====================================================
        QUESTION CONTENT
        =====================================================
        */

        .exam-question-content {
            overflow: hidden;
        }


        .exam-options > * + * {
            margin-top: 0.625rem !important;
        }



        /*
        =====================================================
        COMPACT MODE

        Digunakan otomatis melalui JavaScript jika soal
        dan pilihan terlalu tinggi untuk viewport.
        =====================================================
        */

        .exam-compact .exam-question-content {
            padding-top: 0.55rem !important;
            padding-bottom: 0.55rem !important;
        }


        .exam-compact .exam-question-block {
            margin-bottom: 0.55rem !important;
        }


        .exam-compact .exam-question-text {
            font-size: 0.75rem !important;
            line-height: 1.3rem !important;
        }


        .exam-compact .exam-options > * + * {
            margin-top: 0.38rem !important;
        }


        .exam-compact .exam-option {
            padding-top: 0.45rem !important;
            padding-bottom: 0.45rem !important;
        }


        .exam-compact .exam-actions {
            margin-top: 0.55rem !important;
            padding-top: 0.5rem !important;
        }



        /*
        =====================================================
        ULTRA COMPACT MODE
        =====================================================
        */

        .exam-ultra-compact .exam-question-content {
            padding-top: 0.35rem !important;
            padding-bottom: 0.35rem !important;
        }


        .exam-ultra-compact .exam-question-block {
            margin-bottom: 0.3rem !important;
        }


        .exam-ultra-compact .exam-question-text {
            font-size: 0.68rem !important;
            line-height: 1.05rem !important;
        }


        .exam-ultra-compact .exam-options > * + * {
            margin-top: 0.22rem !important;
        }


        .exam-ultra-compact .exam-option {
            padding-top: 0.3rem !important;
            padding-bottom: 0.3rem !important;
            font-size: 0.67rem !important;
        }


        .exam-ultra-compact .exam-actions {
            margin-top: 0.3rem !important;
            padding-top: 0.3rem !important;
        }



        /*
        =====================================================
        SHORT LAPTOP SCREEN
        =====================================================
        */

        @media (max-height: 760px) and (min-width: 1024px) {

            #exam-site-header {
                height: 50px !important;
            }


            #exam-main {
                padding-top: 5px !important;
                padding-bottom: 5px !important;
            }


            #exam-site-footer {
                height: 16px !important;
                font-size: 7px !important;
            }

        }


        /*
        =====================================================
        EXTRA SHORT SCREEN
        =====================================================
        */

        @media (max-height: 650px) and (min-width: 1024px) {

            #exam-site-header {
                height: 46px !important;
            }


            #exam-site-footer {
                display: none !important;
            }

        }


    </style>

</head>



<body
    class="
        bg-slate-950
        text-slate-100
        font-sans
        antialiased

        h-[100dvh]

        overflow-hidden

        flex
        flex-col

        selection:bg-blue-500
        selection:text-white
    "
>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header
        id="exam-site-header"

        class="
            h-14

            bg-slate-900/95

            border-b
            border-slate-800

            px-4
            sm:px-6
            lg:px-7

            flex
            flex-row

            items-center
            justify-between

            gap-4

            shrink-0

            backdrop-blur-xl
        "
    >


        <!-- =================================================
             BRAND
        ================================================== -->

        <a
            href="index.html"

            class="
                flex
                flex-row

                items-center

                gap-2.5

                min-w-0

                shrink-0

                group
            "

            aria-label="Kembali ke Ruang Tryout"
        >


            <!-- LOGO LETTER -->

            <div
                class="
                    w-9
                    h-9

                    rounded-xl

                    bg-blue-600

                    flex
                    items-center
                    justify-center

                    text-white

                    text-base
                    font-black

                    shadow-lg
                    shadow-blue-600/20

                    group-hover:bg-blue-500

                    transition-colors

                    shrink-0
                "
            >

                R

            </div>



            <!-- BRAND TEXT -->

            <div
                class="
                    min-w-0
                    leading-tight
                "
            >


                <div
                    class="
                        text-sm
                        sm:text-base

                        font-black

                        tracking-tight

                        text-white

                        whitespace-nowrap
                    "
                >

                    Ruang<span class="text-blue-400">Tryout</span>

                </div>


                <div
                    class="
                        hidden
                        sm:block

                        mt-0.5

                        text-[8px]

                        uppercase

                        tracking-[0.18em]

                        font-bold

                        text-slate-500

                        whitespace-nowrap
                    "
                >

                    Mode Simulasi CAT

                </div>

            </div>

        </a>



        <!-- =================================================
             STATUS + EXIT
        ================================================== -->

        <div
            class="
                flex
                flex-row

                items-center

                justify-end

                gap-3

                min-w-0

                shrink-0
            "
        >


            <!-- LIVE STATUS -->

            <span
                class="
                    hidden
                    md:inline-flex

                    flex-row

                    items-center

                    gap-1.5

                    text-[9px]

                    font-semibold

                    text-slate-500

                    whitespace-nowrap
                "
            >

                <span
                    class="
                        w-1.5
                        h-1.5

                        rounded-full

                        bg-emerald-500
                    "
                ></span>


                Ujian sedang berlangsung

            </span>



            <!-- EXIT BUTTON -->

            <button
                type="button"

                onclick="requestExitExam()"

                class="
                    inline-flex
                    flex-row

                    items-center
                    justify-center

                    gap-2

                    bg-slate-800

                    hover:bg-slate-700

                    text-slate-300

                    text-[10px]
                    sm:text-xs

                    font-bold

                    px-3
                    sm:px-4

                    py-2.5

                    rounded-xl

                    border
                    border-slate-700

                    hover:border-slate-600

                    whitespace-nowrap

                    transition-all
                "
            >


                <svg
                    width="14"
                    height="14"

                    viewBox="0 0 24 24"

                    fill="none"

                    stroke="currentColor"

                    stroke-width="2"

                    aria-hidden="true"
                >

                    <path d="M10 17l5-5-5-5" />

                    <path d="M15 12H3" />

                    <path
                        d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"
                    />

                </svg>


                <span class="hidden sm:inline">

                    Keluar Ujian

                </span>


                <span class="sm:hidden">

                    Keluar

                </span>

            </button>

        </div>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main
        id="exam-main"

        class="
            flex-1

            min-h-0

            w-full

            px-2
            sm:px-3
            lg:px-3.5

            py-2

            flex
            flex-col

            overflow-hidden
        "
    >


        <div
            id="quiz-card"

            class="
                w-full

                flex-1

                min-h-0

                bg-slate-900

                rounded-2xl

                border
                border-slate-800

                overflow-hidden

                flex
                flex-col

                shadow-2xl
                shadow-black/10
            "
        >


            <!-- LOADING -->

            <div
                class="
                    flex-1

                    flex

                    items-center
                    justify-center
                "
            >


                <div class="text-center">


                    <div
                        class="
                            w-11
                            h-11

                            mx-auto

                            rounded-xl

                            border
                            border-blue-500/20

                            bg-blue-500/10

                            flex

                            items-center
                            justify-center
                        "
                    >


                        <span
                            class="
                                w-5
                                h-5

                                rounded-full

                                border-2

                                border-blue-400

                                border-t-transparent

                                animate-spin
                            "
                        ></span>

                    </div>


                    <p
                        class="
                            mt-3

                            text-sm

                            text-slate-400

                            font-medium
                        "
                    >

                        Menyiapkan lembar ujian...

                    </p>

                </div>

            </div>

        </div>

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer
        id="exam-site-footer"

        class="
            h-[18px]

            shrink-0

            border-t
            border-slate-900

            bg-slate-950

            flex
            items-center
            justify-center

            text-[8px]

            text-slate-600
        "
    >

        &copy; 2026 Ruang Tryout &bull; Platform Simulasi Ujian Independen

    </footer>



    <!-- =====================================================
         FIREBASE SDK
    ====================================================== -->

    <script
        src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"
    ></script>


    <script
        src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"
    ></script>


    <script
        src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"
    ></script>


    <script src="firebase-config.js"></script>



    <!-- =====================================================
         QUESTIONS + APPLICATION
    ====================================================== -->

    <script src="questions.js"></script>

    <script src="app.js"></script>


</body>

</html>
